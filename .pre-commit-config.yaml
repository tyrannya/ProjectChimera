repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: ^artifacts/diagnostics/btc_regimes_v4/regime_diagnostics\.md$
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=512"]
        exclude: '^(data/research/btc_usdt_1h_gen1_trades_hourly_pre_styx[.]parquet|artifacts/benchmark/btc_p3_(microstructure_v1|ohlcv14|ohlcv14_plus_microstructure_v1)_(lightgbm|logistic_regression|xgboost)/outer_predictions[.]parquet)$'
      - id: check-merge-conflict
      - id: detect-private-key
      - id: debug-statements

  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black
        language_version: python3.11

  - repo: https://github.com/PyCQA/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        # Configured in setup.cfg so `flake8` from the shell agrees with the hook.

  - repo: local
    hooks:
      - id: no-committed-env
        name: refuse a committed .env
        entry: .env must never be committed; only .env.example belongs in git
        language: fail
        files: ^\.env$
