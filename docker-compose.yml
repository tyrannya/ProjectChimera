# ProjectChimera stack. Every service is dry-run/research only.
#
#   recorder    - prospective market-data recorder, public endpoints only
#   demo        - dry-run demo campaign runner, reads the recorder's files
#   prometheus  - scrapes metrics from the recorder and the demo runner
#   grafana     - dashboards over Prometheus
#   alertmanager- routes Prometheus alerts
#
# HISTORICAL, behind `profiles: ["legacy"]`, started only by
# `docker compose --profile legacy up`:
#   freqtrade   - the retired trading engine (section 3.3, PR-13)
#   nn_infer    - the retired HTTP inference service
#
# `legacy` marks what was retired, not what is optional. A service that is part
# of the demo path -- the recorder and the demo runner PR-12 adds -- must carry
# no `profiles:` key at all, so that it lands in the default stack; inheriting
# `legacy` would silently remove the demo path from `docker compose up`.
#
# Live trading is NOT reachable from this file: tools/run_bot.py refuses to
# start a live config unless ENABLE_LIVE_TRADING=I_UNDERSTAND_THE_RISK is in the
# environment, and the default command below asks for the dry-run config.

name: chimera

networks:
  bot_net:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
  model_artifacts:
  recorder_data:
  demo_state:

services:
  # --- FREQTRADE (HISTORICAL - not on the demo path; profile `legacy`) -----
  freqtrade:
    # HISTORICAL - not on the demo path (PR-13, section 3.3). Kept, not
    # deleted; started only by `docker compose --profile legacy up`.
    profiles: ["legacy"]
    build:
      context: .
      dockerfile: Dockerfile
    image: chimera/freqtrade:local
    container_name: chimera_freqtrade
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # Explicitly blank: the container cannot trade live unless the operator
      # sets this in their own environment.
      ENABLE_LIVE_TRADING: ""
    command: ["--exchange", "binance", "--mode", "test", "--strategy", "NNPredictorStrategy"]
    depends_on:
      nn_infer:
        condition: service_healthy
    networks:
      - bot_net
    volumes:
      - ./conf:/chimera/conf:ro
      - ./strategies:/chimera/strategies:ro
      - ./user_data:/chimera/user_data
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f tools.run_bot > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # --- NN INFERENCE (HISTORICAL - not on the demo path; profile `legacy`) --
  nn_infer:
    # HISTORICAL - not on the demo path (PR-13, section 3.3). Kept, not
    # deleted; started only by `docker compose --profile legacy up`. The
    # `freqtrade` service that depends on it carries the same profile, so the
    # dependency is either wholly present or wholly absent.
    profiles: ["legacy"]
    build:
      context: .
      dockerfile: nn/Dockerfile.nn_infer
    image: chimera/nn-infer:local
    container_name: chimera_nn_infer
    restart: unless-stopped
    environment:
      CHIMERA_MODELS_DIR: /app/artifacts/models
    networks:
      - bot_net
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      # Trained models land here; the service serves whatever current.json points at.
      - model_artifacts:/app/artifacts
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/livez"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # --- PROSPECTIVE RECORDER ------------------------------------------------
  # Public market data only. The recorder subscribes to no authenticated
  # endpoint, so there is no credential to pass in and none is read: no
  # env_file, no environment block, no secret mount.
  #
  # `recorder` and `demo` carry NO `profiles:` key, deliberately. They are the
  # demo deployment, so they are what `docker compose up` starts; a profile
  # would make the default stack an observability stack watching nothing, and
  # conf/prometheus.yml's two new jobs would scrape services the default stack
  # never starts -- permanently-down jobs, which is the exact defect the header
  # of that file records and was written to prevent. They must not gain the
  # `legacy` profile either: the change that takes the retired runtime off the
  # default stack puts `legacy` on `freqtrade` and `nn_infer`, and a service
  # listing a profile starts only under it, so `legacy` here would remove the
  # demo path from `docker compose up` altogether. Neither retired service is
  # deleted by this change; after it, every scrape job in conf/prometheus.yml
  # still names a service the default topology starts.
  recorder:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.recorder
    image: chimera/recorder:local
    container_name: chimera_recorder
    restart: unless-stopped
    command:
      - "--base-dir"
      - "/var/lib/chimera/data"
      - "--log-level"
      - "INFO"
      - "run"
      - "--metrics-port"
      - "9102"
    networks:
      - bot_net
    ports:
      - "127.0.0.1:9102:9102"
    volumes:
      - recorder_data:/var/lib/chimera/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9102/metrics', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # --- DEMO RUNNER ---------------------------------------------------------
  # Dry-run venue only. No credential reaches this container and there is none
  # to give it: chimera/demo and chimera/carry import no network module and hold
  # no credential marker, which tests/test_demo_no_live_path.py asserts. The
  # recorder's storage root is mounted read-only, because the runner reads the
  # recorder's files and writes only under its own state volume.
  #
  # It cannot start yet, and that is correct rather than broken: the committed
  # conf/demo/pvc1.json carries protocol_hash=null and therefore no rules block,
  # so the runner refuses to construct R1_carry rather than choose a parameter
  # the protocol has not frozen. Until the protocol is preregistered, start
  # `recorder prometheus grafana alertmanager` and leave this service out.
  # docs/demo_runbook.md section 0.1 says the same thing to the operator.
  demo:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.demo
    image: chimera/demo:local
    container_name: chimera_demo
    restart: unless-stopped
    command:
      - "--config"
      - "/chimera/conf/demo/pvc1.json"
      - "--root"
      - "/var/lib/chimera/data"
      - "run"
      - "--metrics-port"
      - "9103"
    depends_on:
      recorder:
        condition: service_healthy
    networks:
      - bot_net
    ports:
      - "127.0.0.1:9103:9103"
    volumes:
      - ./conf:/chimera/conf:ro
      - recorder_data:/var/lib/chimera/data:ro
      - demo_state:/chimera/state
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9103/metrics', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # --- PROMETHEUS ----------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: chimera_prometheus
    restart: unless-stopped
    user: "65534:65534"
    networks:
      - bot_net
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./conf/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./conf/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./conf/alerts_demo.yml:/etc/prometheus/alerts_demo.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

  # --- GRAFANA -------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.1.0
    container_name: chimera_grafana
    restart: unless-stopped
    user: "472:472"
    networks:
      - bot_net
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      # Without this mount the dashboards in the repository were never loaded.
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # --- ALERTMANAGER --------------------------------------------------------
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: chimera_alertmanager
    restart: unless-stopped
    user: "65534:65534"
    networks:
      - bot_net
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./conf/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
