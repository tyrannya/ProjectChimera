# Only targets that exist in docker-compose.yml are scraped here. The previous
# version scraped `freqtrade_exporter` and `drift_watcher`, neither of which is
# a service in this repository, so those jobs were permanently down.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: nn_infer
    metrics_path: /metrics
    static_configs:
      - targets: ["nn_infer:3000"]

  - job_name: freqtrade
    metrics_path: /metrics
    static_configs:
      - targets: ["freqtrade:9101"]
