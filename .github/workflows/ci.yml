name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# CI never talks to an exchange and never trades. There is no live-capable
# entrypoint in any job here, and no exchange secrets are passed to any step.
env:
  ENABLE_LIVE_TRADING: ""
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lint tooling
        run: pip install black flake8 mypy pre-commit

      - name: Compile every module
        # Catches the syntax and indentation errors that made two files in this
        # repository unimportable for months.
        run: python -m compileall -q .

      - name: pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

      - name: docker compose config
        # Relocated here by PR-13 from the `Config validation` job, which became
        # manual. This is not a Freqtrade check: it is the only thing that
        # parses docker-compose.yml on a pull request, and PR-13 is the change
        # that edits that file, so it has to keep running on every push and PR.
        run: docker compose config --quiet

      - name: docker compose config, every profile
        # PR-13 put the retired services behind a profile. Without naming the
        # profile, `config` no longer parses those two service definitions at
        # all, and a syntax error in a disconnected service would go unseen
        # until somebody tried to run it.
        run: docker compose --profile legacy config --quiet

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      # Both legs are binding. A Windows-only failure is a real failure, and
      # cancelling the other leg on the first red hides half the answer.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install the locked dependency set (Linux)
        # requirements-lock.txt pins the exact resolution this suite is known to
        # pass against, so a dependency release cannot silently change what CI
        # ran. `-e . --no-deps` then adds the checkout itself without letting pip
        # re-resolve anything the lock already decided. The CPU torch index keeps
        # the runner from downloading ~2GB of CUDA wheels, and publishes the
        # `+cpu` build the lock names.
        if: runner.os == 'Linux'
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-lock.txt
          pip install -e . --no-deps

      - name: Install the project and its real dependencies (Windows)
        # The lock is Linux-specific -- it names `torch==2.14.0+cpu` and carries
        # Linux-only wheels -- so Windows resolves from pyproject.toml under its
        # declared bounds. See the header of requirements-lock.txt.
        if: runner.os == 'Windows'
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -e ".[all]"

      - name: Show resolved versions
        run: pip list

      - name: Verify the committed research data and the documents that describe it
        # Three fail-closed checks that do not need a model fit: the OHLCV
        # snapshot, the P3 trade source (including its value-level agreement with
        # the candle history), and that no front-door document declares a
        # checkpoint unrun while its evidence is committed here.
        run: |
          python -m tools.verify_research_snapshot
          python -m tools.verify_trade_snapshot
          python -m tools.verify_research_state

      - name: Verify every frozen evidence manifest
        # PR-02's scientific-integrity check, executed rather than asserted: the
        # portability work must move no frozen byte. This matters most on the
        # Windows leg, where a checkout that converted line endings would change
        # the bytes of every text file a manifest covers -- `.gitattributes`
        # forbids that conversion, and this step is what proves it held.
        # `shell: python` so the same step runs on both runners.
        shell: python
        run: |
          from pathlib import Path
          from tools.freeze_evidence import check
          manifests = sorted(Path("artifacts").glob("*SHA256SUMS.txt"))
          if not manifests:
              raise SystemExit("no frozen manifest found")
          problems = []
          for manifest in manifests:
              found = check(manifest)
              print(f"{manifest}: {'verified' if not found else found}")
              problems += found
          if problems:
              raise SystemExit(f"{len(problems)} frozen file(s) moved")
          print(f"{len(manifests)} frozen manifests verified")

      - name: Run the test suite
        run: pytest -q --maxfail=1

      - name: End-to-end smoke (synthetic data, CPU, no network)
        # This is the substitute for training on every commit: it walks
        # candles -> features -> tiny training -> artifact -> service ->
        # strategy -> risk in about a minute.
        run: python -m tools.smoke

  config:
    name: Config validation
    # HISTORICAL, PR-13 (section 3.3): this job installs Freqtrade and validates
    # the retired `conf/<exchange>.<mode>.json` profiles against Freqtrade's own
    # schema. It is kept in full, runnable on demand, and off every automatic
    # trigger. The job-level `if:` is the only mechanism that can do that:
    # GitHub Actions has no per-job `on:`, triggers are declared once for the
    # whole workflow, and every job is created for every matching event. The
    # workflow's `on:` block is therefore deliberately unchanged, so `lint` and
    # `test` still run on push and pull_request and this job stays reachable
    # from the Actions "Run workflow" button.
    #
    # Nothing is lost from automatic coverage. tests/test_config_and_cli.py:55
    # runs the same `validate_config_schema` over the same six profiles, and
    # :142 asserts the live launcher exits 2 without the acknowledgement; both
    # run in the `test` job on both OS legs. The one step that had no equivalent
    # was `docker compose config`, which is why it moved into `lint` above
    # rather than becoming manual with the rest of this job.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install trading dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[trade]"

      - name: Validate every config against Freqtrade's own schema
        run: |
          python - <<'PY'
          import json
          from freqtrade.configuration.config_validation import validate_config_schema
          from tools.run_bot import load_config, resolve_placeholders

          for exchange in ("binance", "bybit", "okx"):
              for mode in ("test", "live"):
                  config = resolve_placeholders(load_config(exchange, mode), [])
                  # StrategyResolver copies these off the strategy at load time.
                  config.update(
                      runmode="dry_run", stoploss=-0.05,
                      minimal_roi={"0": 0.03}, timeframe="1h",
                  )
                  validate_config_schema(config)
                  print(f"{exchange}.{mode}: valid (dry_run={config['dry_run']})")
          PY

      - name: Assert live trading is unreachable without the acknowledgement
        run: |
          set +e
          python -m tools.run_bot --exchange binance --mode live --dry-run-only-check
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then
            echo "::error::A live config launched without ENABLE_LIVE_TRADING (exit $code)"
            exit 1
          fi
          echo "Live trading correctly refused."

  docker:
    name: Docker build smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # HISTORICAL, PR-13 (section 3.3): both images built here are retired -- the
    # Freqtrade image and the inference image. `!= 'pull_request'` still made
    # this an automatic job, because it ran on every push to main; section 3.3
    # asks for the retired images to be off CI's automatic triggers, and one
    # line is the whole change. Both build steps, both cache scopes and the
    # whole job body are kept, so the images stay reproducible on demand.
    # Images are also slow to build and rarely the thing that breaks.
    #
    # NOTE for PR-12: a recorder or demo image is an ACTIVE image and must NOT
    # be added to this job, which would put it behind a manual trigger. Give it
    # its own job with its own trigger.
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build the Freqtrade image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: false
          cache-from: type=gha,scope=freqtrade
          cache-to: type=gha,mode=max,scope=freqtrade

      - name: Build the inference image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: nn/Dockerfile.nn_infer
          push: false
          load: false
          cache-from: type=gha,scope=nn-infer
          cache-to: type=gha,mode=max,scope=nn-infer
