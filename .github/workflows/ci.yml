name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  format_pr29_tests:
    name: Format PR29 regression tests
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/report-schema-and-buyhold-sharpe'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/report-schema-and-buyhold-sharpe
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Format and push the touched test
        shell: bash
        run: |
          python -m pip install black
          black tests/test_wf_diagnostics.py
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_wf_diagnostics.py
          git commit -m "Format PR29 schema regressions"
          git push origin HEAD:fix/report-schema-and-buyhold-sharpe
