name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# CI never talks to an exchange and never trades. There is no live-capable
# entrypoint in any job here, and no exchange secrets are passed to any step.
env:
  ENABLE_LIVE_TRADING: ""
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: read

jobs:
  patch_pr29_fixture:
    name: Patch PR29 synthetic fixture
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/report-schema-and-buyhold-sharpe'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/report-schema-and-buyhold-sharpe
          fetch-depth: 0
      - name: Apply narrow test-only patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_wf_diagnostics.py")
          text = path.read_text()
          old = '''    if schema == "legacy":
              trading["sharpe"] = net_return * 10
          else:
              trading["annualised_sharpe"] = net_return * 2
              trading["per_trade_sharpe"] = net_return
          '''
          if old not in text:
              print("fixture already patched; nothing to do")
              raise SystemExit(0)
          new = '''    if schema == "legacy":
              trading["sharpe"] = net_return * 10
          else:
              trading.update(
                  annualised_sharpe=net_return * 2,
                  annualised_sharpe_reason="",
                  sharpe_basis=ev.SHARPE_BASIS,
                  candle_max_drawdown=0.05,
                  elapsed_intervals=83,
                  per_trade_sharpe=net_return,
                  per_trade_sharpe_reason="",
              )
          '''
          if text.count(old) != 1:
              raise SystemExit(f"expected one fixture helper, found {text.count(old)}")
          text = text.replace(old, new, 1)

          marker = '''\n\ndef test_a_half_renamed_schema_fails_rather_than_being_treated_as_legacy(tmp_path):\n'''
          tests = '''

          @pytest.mark.parametrize(
              "field",
              [
                  "annualised_sharpe_reason",
                  "sharpe_basis",
                  "candle_max_drawdown",
                  "elapsed_intervals",
                  "per_trade_sharpe_reason",
              ],
          )
          def test_a_current_artifact_missing_any_required_risk_field_fails_closed(
              tmp_path, field
          ):
              """Every current risk-report field is required, not just summary metrics."""
              directory = tmp_path / "missing_risk_field"
              write_run(directory)
              artifact = directory / wf_diagnostics.ARTIFACT_NAME
              payload = json.loads(artifact.read_text())
              del payload["folds"][0]["outer_validation"]["mtst"]["trading"][field]
              artifact.write_text(json.dumps(payload))

              run = wf_diagnostics.load_run(directory)
              schema, problems = wf_diagnostics.classify_schema(run)
              assert schema == ""
              assert any(field in problem for problem in problems)
              assert wf_diagnostics.audit_run(run)


          def test_a_defined_current_sharpe_with_a_different_basis_is_refused(tmp_path):
              """Defined annualised Sharpes under unlike bases cannot be aggregated."""
              directory = tmp_path / "wrong_basis"
              write_run(directory)
              artifact = directory / wf_diagnostics.ARTIFACT_NAME
              payload = json.loads(artifact.read_text())
              payload["folds"][0]["outer_validation"]["mtst"]["trading"]["sharpe_basis"] = (
                  "a different annualisation basis"
              )
              artifact.write_text(json.dumps(payload))

              run = wf_diagnostics.load_run(directory)
              schema, problems = wf_diagnostics.classify_schema(run)
              assert schema == ""
              assert any("sharpe_basis" in problem for problem in problems)
              assert any("Refusing to aggregate unlike risk metrics" in problem for problem in problems)
              assert wf_diagnostics.audit_run(run)
          '''
          tests = tests.replace("\n          ", "\n").lstrip("\n")
          if text.count(marker) != 1:
              raise SystemExit(f"expected one insertion marker, found {text.count(marker)}")
          text = text.replace(marker, "\n\n" + tests + marker, 1)
          path.write_text(text)
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_wf_diagnostics.py
          git commit -m "Test complete current risk report schema"
          git push origin HEAD:fix/report-schema-and-buyhold-sharpe

  lint:
    name: Lint and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lint tooling
        run: pip install black flake8 mypy pre-commit

      - name: Compile every module
        # Catches the syntax and indentation errors that made two files in this
        # repository unimportable for months.
        run: python -m compileall -q .

      - name: pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install the project and its real dependencies
        # The whole dependency graph, from pyproject.toml. The previous workflow
        # installed only `pandas pytest`, so the suite errored at collection and
        # nothing it claimed to test was ever exercised. The CPU torch index
        # keeps the runner from downloading ~2GB of CUDA wheels.
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -e ".[all]"

      - name: Show resolved versions
        run: pip list

      - name: Run the test suite
        run: pytest -q --maxfail=1

      - name: End-to-end smoke (synthetic data, CPU, no network)
        # This is the substitute for training on every commit: it walks
        # candles -> features -> tiny training -> artifact -> service ->
        # strategy -> risk in about a minute.
        run: python -m tools.smoke

  config:
    name: Config validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install trading dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[trade]"

      - name: Validate every config against Freqtrade's own schema
        run: |
          python - <<'PY'
          import json
          from freqtrade.configuration.config_validation import validate_config_schema
          from tools.run_bot import load_config, resolve_placeholders

          for exchange in ("binance", "bybit", "okx"):
              for mode in ("test", "live"):
                  config = resolve_placeholders(load_config(exchange, mode), [])
                  # StrategyResolver copies these off the strategy at load time.
                  config.update(
                      runmode="dry_run", stoploss=-0.05,
                      minimal_roi={"0": 0.03}, timeframe="1h",
                  )
                  validate_config_schema(config)
                  print(f"{exchange}.{mode}: valid (dry_run={config['dry_run']})")
          PY

      - name: Assert live trading is unreachable without the acknowledgement
        run: |
          set +e
          python -m tools.run_bot --exchange binance --mode live --dry-run-only-check
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then
            echo "::error::A live config launched without ENABLE_LIVE_TRADING (exit $code)"
            exit 1
          fi
          echo "Live trading correctly refused."

      - name: docker compose config
        run: docker compose config --quiet

  docker:
    name: Docker build smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Images are slow to build and rarely the thing that breaks, so this runs
    # on main and on demand rather than on every pull request.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build the Freqtrade image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: false
          cache-from: type=gha,scope=freqtrade
          cache-to: type=gha,mode=max,scope=freqtrade

      - name: Build the inference image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: nn/Dockerfile.nn_infer
          push: false
          load: false
          cache-from: type=gha,scope=nn-infer
          cache-to: type=gha,mode=max,scope=nn-infer
