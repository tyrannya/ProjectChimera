name: CI

on:
  pull_request:

permissions:
  contents: write
  pull-requests: read

jobs:
  apply_schema_fix:
    name: Apply final schema fix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/report-schema-and-buyhold-sharpe
          fetch-depth: 0
      - name: Patch classifier and add regression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          wf = Path("nn/wf_diagnostics.py")
          text = wf.read_text()
          start_needle = '            trading = report.get("trading") or {}\n'
          end_needle = '                if "per_trade_sharpe_reason" not in trading:\n'
          start = text.index(start_needle)
          end = text.index(end_needle, start)
          old = text[start:end]
          new = '''            trading = report.get("trading") or {}
            legacy = LEGACY_TRADING_KEY in trading
            missing = required - present
            where = f"fold {label} {model}"
            try:
                detected = validate_report_schema(report, where)
            except RegimeDataError as exc:
                problems.append(str(exc))
                continue
            if detected == SCHEMA_LEGACY and "per_trade_sharpe_reason" in trading:
                problems.append(
                    f"{where} carries the pre-correction {LEGACY_TRADING_KEY!r} field "
                    "alongside current-only trading.per_trade_sharpe_reason: this is "
                    "neither the old metric schema nor the new one, so what its "
                    "numbers mean is unknown"
                )
                continue

            if not missing and not legacy:
                if detected != SCHEMA_CURRENT:
                    problems.append(
                        f"{where} passed the summary-metric shape as current but the "
                        f"risk-report validator classified it as {detected!r}"
                    )
                    continue
'''
          if 'validate_report_schema(report, where)' not in old:
              raise SystemExit("classifier source block did not contain expected validation")
          wf.write_text(text[:start] + new + text[end:])

          tests = Path("tests/test_wf_diagnostics.py")
          t = tests.read_text()
          marker = "\n\ndef test_a_half_renamed_schema_fails_rather_than_being_treated_as_legacy(tmp_path):\n"
          addition = '''

@pytest.mark.parametrize(
    "field, value",
    [
        ("annualised_sharpe_reason", ""),
        ("sharpe_basis", ev.SHARPE_BASIS),
        ("candle_max_drawdown", 0.05),
        ("elapsed_intervals", 83),
        ("per_trade_sharpe_reason", ""),
    ],
)
def test_a_legacy_artifact_with_a_current_only_risk_field_fails_closed(
    tmp_path, field, value
):
    """A hybrid old/new report is never accepted as genuinely legacy."""
    directory = tmp_path / f"legacy_with_{field}"
    write_run(directory, schema="legacy")
    artifact = directory / wf_diagnostics.ARTIFACT_NAME
    payload = json.loads(artifact.read_text())
    payload["folds"][0]["outer_validation"]["mtst"]["trading"][field] = value
    artifact.write_text(json.dumps(payload))

    run = wf_diagnostics.load_run(directory)
    schema, problems = wf_diagnostics.classify_schema(run)
    assert schema == ""
    assert problems
    assert any("neither the old metric schema nor the new one" in p for p in problems)
    assert wf_diagnostics.audit_run(run)
'''
          if "test_a_legacy_artifact_with_a_current_only_risk_field_fails_closed" not in t:
              if t.count(marker) != 1:
                  raise SystemExit(f"expected one test insertion marker, found {t.count(marker)}")
              t = t.replace(marker, addition + marker, 1)
              tests.write_text(t)
          PY

          python -m pip install -q black
          black nn/wf_diagnostics.py tests/test_wf_diagnostics.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nn/wf_diagnostics.py tests/test_wf_diagnostics.py
          git commit -m "Reject hybrid legacy risk-report fields"
          git push origin HEAD:fix/report-schema-and-buyhold-sharpe
