name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  patch_pr29_wf:
    name: Restore narrow PR29 wf diff
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/report-schema-and-buyhold-sharpe'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/report-schema-and-buyhold-sharpe
          fetch-depth: 0
      - name: Rebuild from main plus intended patch
        shell: bash
        run: |
          git checkout origin/main -- nn/wf_diagnostics.py
          python - <<'PY'
          from pathlib import Path

          path = Path("nn/wf_diagnostics.py")
          text = path.read_text()

          old = "from chimera.contracts import CLASS_ORDER\nfrom nn.regime import (\n"
          new = "from chimera.contracts import CLASS_ORDER\nfrom nn.evaluate import SHARPE_BASIS\nfrom nn.regime import (\n"
          if text.count(old) != 1:
              raise SystemExit("unexpected import block")
          text = text.replace(old, new, 1)

          old = "    raw_block_statistics,\n)\nfrom nn.walkforward"
          new = "    raw_block_statistics,\n    validate_report_schema,\n)\nfrom nn.walkforward"
          if text.count(old) != 1:
              raise SystemExit("unexpected regime import block")
          text = text.replace(old, new, 1)

          old = "    * every required metric present and no ``sharpe`` — current, read in full;\n"
          new = (
              "    * every required summary metric plus the complete current risk-report schema\n"
              "      present, no ``sharpe``, and every defined annualised Sharpe carrying the\n"
              "      current :data:`nn.evaluate.SHARPE_BASIS` — current, read in full;\n"
          )
          if text.count(old) != 1:
              raise SystemExit("unexpected schema doc line")
          text = text.replace(old, new, 1)

          old = "    old and new fields, a partial rename — is a problem, not a degraded read.\n"
          new = (
              "    old and new fields, a partial rename, or an incompatible Sharpe basis — is a\n"
              "    problem, not a degraded read.\n"
          )
          if text.count(old) != 1:
              raise SystemExit("unexpected schema doc ending")
          text = text.replace(old, new, 1)

          old = (
              '            legacy = LEGACY_TRADING_KEY in (report.get("trading") or {})\n'
              '            missing = required - present\n'
              '\n'
              '            if not missing and not legacy:\n'
              '                schemas.add(SCHEMA_CURRENT)\n'
          )
          new = (
              '            trading = report.get("trading") or {}\n'
              '            legacy = LEGACY_TRADING_KEY in trading\n'
              '            missing = required - present\n'
              '\n'
              '            if not missing and not legacy:\n'
              '                where = f"fold {label} {model}"\n'
              '                try:\n'
              '                    detected = validate_report_schema(report, where)\n'
              '                except RegimeDataError as exc:\n'
              '                    problems.append(str(exc))\n'
              '                    continue\n'
              '                if detected != SCHEMA_CURRENT:\n'
              '                    problems.append(\n'
              '                        f"{where} passed the summary-metric shape as current but the "\n'
              '                        f"risk-report validator classified it as {detected!r}"\n'
              '                    )\n'
              '                    continue\n'
              '                if "per_trade_sharpe_reason" not in trading:\n'
              '                    problems.append(\n'
              '                        f"{where} is missing trading.per_trade_sharpe_reason. A current "\n'
              '                        "artifact must carry the reason field even when the statistic is "\n'
              '                        "defined; refusing to aggregate around the gap"\n'
              '                    )\n'
              '                    continue\n'
              '                if not isinstance(trading["per_trade_sharpe_reason"], str):\n'
              '                    problems.append(\n'
              '                        f"{where} trading.per_trade_sharpe_reason is "\n'
              '                        f"{type(trading[\'per_trade_sharpe_reason\']).__name__} "\n'
              '                        f"({trading[\'per_trade_sharpe_reason\']!r}), expected str"\n'
              '                    )\n'
              '                    continue\n'
              '                if (\n'
              '                    trading.get("annualised_sharpe") is not None\n'
              '                    and trading.get("sharpe_basis") != SHARPE_BASIS\n'
              '                ):\n'
              '                    problems.append(\n'
              '                        f"{where} annualised_sharpe is defined under sharpe_basis "\n'
              '                        f"{trading.get(\'sharpe_basis\')!r}, but current runs must use "\n'
              '                        f"{SHARPE_BASIS!r}. Refusing to aggregate unlike risk metrics"\n'
              '                    )\n'
              '                    continue\n'
              '                schemas.add(SCHEMA_CURRENT)\n'
          )
          if text.count(old) != 1:
              raise SystemExit("unexpected classify_schema code block")
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nn/wf_diagnostics.py
          git commit -m "Keep PR29 wf diagnostics diff narrow"
          git push origin HEAD:fix/report-schema-and-buyhold-sharpe
