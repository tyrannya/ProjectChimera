name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# CI never talks to an exchange and never trades. There is no live-capable
# entrypoint in any job here, and no exchange secrets are passed to any step.
env:
  ENABLE_LIVE_TRADING: ""
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lint tooling
        run: pip install black flake8 mypy pre-commit

      - name: Compile every module
        # Catches the syntax and indentation errors that made two files in this
        # repository unimportable for months.
        run: python -m compileall -q .

      - name: pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

      - name: promtool check rules
        # Section 15's CI row, and the acceptance criterion for the alert files.
        # The suite can check that an expression names an exported series; only
        # promtool can check that it is PromQL at all. Section 11.2's adopted
        # DiskLow expression was `min(a, b) < 10e9`, which parses as an
        # aggregation given two arguments and is rejected here -- so without this
        # step the rule file could ship in a form Prometheus refuses to load,
        # taking every other rule in the file down with it.
        run: |
          version=2.53.0
          curl -sSLo /tmp/prometheus.tar.gz \
            "https://github.com/prometheus/prometheus/releases/download/v${version}/prometheus-${version}.linux-amd64.tar.gz"
          tar -xzf /tmp/prometheus.tar.gz -C /tmp
          /tmp/prometheus-${version}.linux-amd64/promtool check rules conf/alerts.yml conf/alerts_demo.yml

      - name: docker compose config
        # Relocated here by PR-13 from the `Config validation` job, which became
        # manual. This is not a Freqtrade check: it is the only thing that
        # parses docker-compose.yml on a pull request, and PR-13 is the change
        # that edits that file, so it has to keep running on every push and PR.
        run: docker compose config --quiet

      - name: docker compose config, every profile
        # PR-13 put the retired services behind a profile. Without naming the
        # profile, `config` no longer parses those two service definitions at
        # all, and a syntax error in a disconnected service would go unseen
        # until somebody tried to run it.
        run: docker compose --profile legacy config --quiet

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # CI runtime headroom for the Windows leg only (R1-k): 90 minutes there,
    # 60 on Linux as before. The Windows regression suite is unchanged and runs
    # in full -- nothing is deselected, skipped or split away, the R1-i
    # crash/persistence files included. Those files fsync on every persist and
    # take 23-28 minutes on a slow Windows runner: main's green push run on
    # 15e97a5 finished at 55 of 60, and R1-k's first run was cancelled at 60
    # inside them with no test failed. Linux finishes in about 26 minutes and
    # keeps its limit. This changes when a run is cut off, never what passes.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 90 || 60 }}
    strategy:
      # Both legs are binding. A Windows-only failure is a real failure, and
      # cancelling the other leg on the first red hides half the answer.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install the locked dependency set (Linux)
        # requirements-lock.txt pins the exact resolution this suite is known to
        # pass against, so a dependency release cannot silently change what CI
        # ran. `-e . --no-deps` then adds the checkout itself without letting pip
        # re-resolve anything the lock already decided. The CPU torch index keeps
        # the runner from downloading ~2GB of CUDA wheels, and publishes the
        # `+cpu` build the lock names.
        if: runner.os == 'Linux'
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-lock.txt
          pip install -e . --no-deps

      - name: Install the project and its real dependencies (Windows)
        # The lock is Linux-specific -- it names `torch==2.14.0+cpu` and carries
        # Linux-only wheels -- so Windows resolves from pyproject.toml under its
        # declared bounds. See the header of requirements-lock.txt.
        if: runner.os == 'Windows'
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -e ".[all]"

      - name: Show resolved versions
        run: pip list

      - name: Verify the committed research data and the documents that describe it
        # Three fail-closed checks that do not need a model fit: the OHLCV
        # snapshot, the P3 trade source (including its value-level agreement with
        # the candle history), and that no front-door document declares a
        # checkpoint unrun while its evidence is committed here.
        run: |
          python -m tools.verify_research_snapshot
          python -m tools.verify_trade_snapshot
          python -m tools.verify_research_state

      - name: Verify every frozen evidence manifest
        # PR-02's scientific-integrity check, executed rather than asserted: the
        # portability work must move no frozen byte. This matters most on the
        # Windows leg, where a checkout that converted line endings would change
        # the bytes of every text file a manifest covers -- `.gitattributes`
        # forbids that conversion, and this step is what proves it held.
        # `shell: python` so the same step runs on both runners.
        shell: python
        run: |
          from pathlib import Path
          from tools.freeze_evidence import check
          manifests = sorted(Path("artifacts").glob("*SHA256SUMS.txt"))
          if not manifests:
              raise SystemExit("no frozen manifest found")
          problems = []
          for manifest in manifests:
              found = check(manifest)
              print(f"{manifest}: {'verified' if not found else found}")
              problems += found
          if problems:
              raise SystemExit(f"{len(problems)} frozen file(s) moved")
          print(f"{len(manifests)} frozen manifests verified")

      - name: Run the test suite
        # R1-j's 48 h synthetic parity witness (marker `replay_determinism`) is
        # the `replay-determinism` job's, not this matrix's: it replays 2,880
        # minutes three times over, and the Windows leg already runs close to
        # this job's timeout.
        run: pytest -q --maxfail=1 -m "not replay_determinism"

      - name: End-to-end smoke (synthetic data, CPU, no network)
        # This is the substitute for training on every commit: it walks
        # candles -> features -> tiny training -> artifact -> service ->
        # strategy -> risk in about a minute.
        run: python -m tools.smoke

  replay-determinism:
    # R1's replay-determinism CI job (master roadmap R1, TECHNICAL DESIGN), with
    # R1-j's canonical witness: 48 hours of synthetic recorder files decided live
    # by `tools.demo_run` across a restart and an operator flatten, then replayed
    # by `tools.replay_parity` with the committed operator-action file, which
    # must report PARITY with nothing diverged, live-only, replay-only or
    # excluded. The last step reads the fixture's own marker line, so a run in
    # which the witness was deselected or skipped cannot pass.
    name: Replay determinism (R1-j 48 h parity)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install the locked dependency set
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-lock.txt
          pip install -e . --no-deps

      - name: Run the canonical 48 h synthetic parity fixture
        run: |
          set -o pipefail
          pytest -m replay_determinism -rA tests/test_r1j_parity_48h.py | tee replay-determinism.log

      - name: Prove the fixture ran and reached PARITY
        shell: python
        run: |
          import json
          log = open("replay-determinism.log", encoding="utf-8").read().splitlines()
          markers = [line for line in log if line.startswith("R1J-48H-PARITY ")]
          if len(markers) != 1:
              raise SystemExit(f"expected one R1J-48H-PARITY marker, found {len(markers)}")
          report = json.loads(markers[0].split(" ", 1)[1])
          print(json.dumps(report, indent=2, sort_keys=True))
          expected = {"label": "PARITY", "parity": True, "divergences": 0, "live_only": 0,
                      "replay_only": 0, "explained_exclusions": 0}
          wrong = {k: report.get(k) for k, v in expected.items() if report.get(k) != v}
          if wrong or report.get("records_compared", 0) < 2882:
              raise SystemExit(f"the 48 h fixture did not reach PARITY: {wrong or report}")
          name = "test_the_48_hour_fixture_reaches_parity_with_a_restart_and_an_operator_action"
          if not any(line.startswith("PASSED") and name in line for line in log):
              raise SystemExit(f"{name} did not PASS")
          if any(line.startswith(("SKIPPED", "XFAIL", "FAILED", "ERROR")) for line in log):
              raise SystemExit("a replay-determinism test was skipped, xfailed or failed")
          print("R1-j 48 h fixture: PARITY")

  unsafe-default-detector:
    # R1-k: a configured limit that no code path enforces fails CI. For every
    # limit `conf/demo/pvc1.json` can carry, the real DemoRunner runs the same
    # synthetic minutes on the committed value and on a breaching one; the
    # committed run must be allowed and the breach refused or halted, naming
    # the limit. `chimera.demo.limit_reachability`'s inventory is checked
    # against the code, and the loss streak and cooldown R1-k retired stay
    # retired while nothing calls `record_trade_result`. The last step reads
    # the detector's own marker line against the schema's limit list, so a run
    # that deselected, skipped or lost a probe cannot pass.
    name: Unsafe-default detector (R1-k)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install the locked dependency set
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-lock.txt
          pip install -e . --no-deps

      - name: Run the detector and the reachability inventory
        run: |
          set -o pipefail
          pytest -m unsafe_default -rA tests/test_r1k_unsafe_default_detector.py tests/test_r1k_limit_reachability.py | tee unsafe-default.log

      - name: Prove every configured limit was probed from both sides
        shell: python
        run: |
          import json
          from chimera.demo.config import LIMIT_FIELDS
          log = open("unsafe-default.log", encoding="utf-8").read().splitlines()
          markers = [line for line in log if line.startswith("R1K-UNSAFE-DEFAULT ")]
          if len(markers) != 1:
              raise SystemExit(f"expected one R1K-UNSAFE-DEFAULT marker, found {len(markers)}")
          report = json.loads(markers[0].split(" ", 1)[1])
          probed = report["limits"]
          if set(probed) != set(LIMIT_FIELDS) or report["configured"] != sorted(LIMIT_FIELDS):
              raise SystemExit(f"unprobed: {sorted(set(LIMIT_FIELDS) - set(probed))}")
          for name, sides in sorted(probed.items()):
              if sides.get("committed") != "allowed" or not sides.get("breach"):
                  raise SystemExit(f"{name} was not witnessed from both sides: {sides}")
              print(f"{name}: committed allowed; breach -> {sides['breach']}")
          if any(line.startswith(("SKIPPED", "XFAIL", "FAILED", "ERROR")) for line in log):
              raise SystemExit("an unsafe-default test was skipped, xfailed or failed")
          print(f"R1-k unsafe-default detector: {len(probed)} configured limits enforced")

  docker:
    name: Docker build smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # HISTORICAL, PR-13 (section 3.3): the image built here is retired -- the
    # inference image. R1-m deleted the Freqtrade image and its build step, and
    # the `config` job that validated the retired exchange profiles against
    # Freqtrade's own schema: its subject and its stated fallback coverage
    # (tests/test_config_and_cli.py) are both gone, so a manual job that can
    # never succeed again would be capability in appearance only.
    # `!= 'pull_request'` still made
    # this an automatic job, because it ran on every push to main; section 3.3
    # asks for the retired images to be off CI's automatic triggers, and one
    # line is the whole change. Both build steps, both cache scopes and the
    # whole job body are kept, so the images stay reproducible on demand.
    # Images are also slow to build and rarely the thing that breaks.
    #
    # NOTE for PR-12: a recorder or demo image is an ACTIVE image and must NOT
    # be added to this job, which would put it behind a manual trigger. Give it
    # its own job with its own trigger.
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build the inference image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: nn/Dockerfile.nn_infer
          push: false
          load: false
          cache-from: type=gha,scope=nn-infer
          cache-to: type=gha,mode=max,scope=nn-infer
