name: PR29 test fixture patch

on:
  push:
    branches:
      - fix/report-schema-and-buyhold-sharpe

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/report-schema-and-buyhold-sharpe
          fetch-depth: 0
      - name: Apply narrow test-only patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_wf_diagnostics.py")
          text = path.read_text()

          old = '''    if schema == "legacy":
              trading["sharpe"] = net_return * 10
          else:
              trading["annualised_sharpe"] = net_return * 2
              trading["per_trade_sharpe"] = net_return
          '''
          new = '''    if schema == "legacy":
              trading["sharpe"] = net_return * 10
          else:
              trading.update(
                  annualised_sharpe=net_return * 2,
                  annualised_sharpe_reason="",
                  sharpe_basis=ev.SHARPE_BASIS,
                  candle_max_drawdown=0.05,
                  elapsed_intervals=83,
                  per_trade_sharpe=net_return,
                  per_trade_sharpe_reason="",
              )
          '''
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one current report helper, found {text.count(old)}")
          text = text.replace(old, new, 1)

          marker = '''\n\ndef test_a_half_renamed_schema_fails_rather_than_being_treated_as_legacy(tmp_path):\n'''
          tests = '''

          @pytest.mark.parametrize(
              "field",
              [
                  "annualised_sharpe_reason",
                  "sharpe_basis",
                  "candle_max_drawdown",
                  "elapsed_intervals",
                  "per_trade_sharpe_reason",
              ],
          )
          def test_a_current_artifact_missing_any_required_risk_field_fails_closed(
              tmp_path, field
          ):
              """Every current risk-report field is required, not just summary metrics."""
              directory = tmp_path / "missing_risk_field"
              write_run(directory)
              artifact = directory / wf_diagnostics.ARTIFACT_NAME
              payload = json.loads(artifact.read_text())
              del payload["folds"][0]["outer_validation"]["mtst"]["trading"][field]
              artifact.write_text(json.dumps(payload))

              run = wf_diagnostics.load_run(directory)
              schema, problems = wf_diagnostics.classify_schema(run)
              assert schema == ""
              assert any(field in problem for problem in problems)
              assert wf_diagnostics.audit_run(run)


          def test_a_defined_current_sharpe_with_a_different_basis_is_refused(tmp_path):
              """Numerically named-identical Sharpes cannot aggregate across unlike bases."""
              directory = tmp_path / "wrong_basis"
              write_run(directory)
              artifact = directory / wf_diagnostics.ARTIFACT_NAME
              payload = json.loads(artifact.read_text())
              payload["folds"][0]["outer_validation"]["mtst"]["trading"]["sharpe_basis"] = (
                  "a different annualisation basis"
              )
              artifact.write_text(json.dumps(payload))

              run = wf_diagnostics.load_run(directory)
              schema, problems = wf_diagnostics.classify_schema(run)
              assert schema == ""
              assert any("sharpe_basis" in problem for problem in problems)
              assert any("Refusing to aggregate unlike risk metrics" in problem for problem in problems)
              assert wf_diagnostics.audit_run(run)
          '''
          tests = tests.replace("\n          ", "\n").lstrip("\n")
          if text.count(marker) != 1:
              raise SystemExit(f"expected exactly one insertion marker, found {text.count(marker)}")
          text = text.replace(marker, "\n\n" + tests + marker, 1)
          path.write_text(text)

          Path(".github/workflows/pr29-test-fixture-patch.yml").unlink()
          PY

          python -m black tests/test_wf_diagnostics.py
          git diff --check

      - name: Commit test-only patch and remove helper workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_wf_diagnostics.py .github/workflows/pr29-test-fixture-patch.yml
          git diff --cached --exit-code && exit 0
          git commit -m "Test complete current risk report schema"
          git push origin HEAD:fix/report-schema-and-buyhold-sharpe
