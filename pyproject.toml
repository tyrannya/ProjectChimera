[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "projectchimera"
version = "0.2.0"
description = "Research and dry-run platform for ML-driven crypto trading on Freqtrade"
requires-python = ">=3.11"

# Core: everything importable by chimera/, which is loaded in every container.
# Deliberately light — no torch, no freqtrade, no ccxt.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "requests>=2.31",
    "prometheus-client>=0.19",
]

# Optional groups. The split exists because the containers genuinely differ:
# the Freqtrade image needs `trade`, the inference image needs `ml`, and only
# a developer needs both. Installing `.[all]` is always correct if unsure.
[project.optional-dependencies]
# Freqtrade container: the execution engine and the strategies.
trade = ["freqtrade>=2024.1"]
# Training and inference: the model, the service, and market data download.
ml = [
    "torch>=2.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "ccxt>=4.2",
]
# Experiment tracking. Entirely optional: `nn.train --mlflow` is opt-in and the
# on-disk artifact is the source of truth either way.
tracking = ["mlflow>=2.10"]
# Hyperparameter search. Only needed for `nn.train --tune-trials N`; the
# default of 0 runs a single training pass with no search at all.
tune = ["ray[tune]>=2.9"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "httpx>=0.27",
    "black>=24.3",
    "flake8>=7.0",
    "mypy>=1.9",
    "pre-commit>=3.6",
]
all = ["projectchimera[trade,ml,tracking,tune,dev]"]

[tool.setuptools]
packages = ["chimera", "nn", "strategies", "strategies.common", "tools"]

[tool.black]
line-length = 95
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# Freqtrade strategies subclass a dynamically-typed base and receive kwargs
# whose types Freqtrade itself does not annotate.
module = "strategies.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*",
    "ignore:Using `httpx` with `starlette.testclient`:UserWarning",
]
