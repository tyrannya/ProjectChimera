[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "projectchimera"
version = "0.2.0"
description = "Research and dry-run platform for ML-driven crypto trading on Freqtrade"
requires-python = ">=3.11"

# Core: everything importable by chimera/, which is loaded in every container.
# Deliberately light — no torch, no freqtrade, no ccxt.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1,<3.0",
    "pyarrow>=14",
    "requests>=2.31",
    "prometheus-client>=0.19",
]

# Optional groups. The split exists because the containers genuinely differ:
# the Freqtrade image needs `trade`, the inference image needs `ml`, and only
# a developer needs both. Installing `.[all]` is always correct if unsure.
[project.optional-dependencies]
# Freqtrade container: the execution engine and the strategies.
trade = ["freqtrade>=2024.1"]
# Training and inference: the model, the service, and market data download.
ml = [
    "torch>=2.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "ccxt>=4.2",
]
# Experiment tracking. Entirely optional: `nn.train --mlflow` is opt-in and the
# on-disk artifact is the source of truth either way.
tracking = ["mlflow>=2.10"]
# Hyperparameter search. Only needed for `nn.train --tune-trials N`; the
# default of 0 runs a single training pass with no search at all.
tune = ["ray[tune]>=2.9"]
# Research benchmarks only: the simple-model family `nn.benchmark` (research
# checkpoint P2a) compares against MTST. Deliberately its own group rather than
# part of `ml`, because nothing in the inference container or any live path
# imports them — a model fitted here is research evidence, never a deployed
# artifact — and the Freqtrade and inference images must not grow three
# gradient-boosting libraries to serve a Transformer. CI installs `.[all]`, so
# the benchmark and its tests are exercised without any of this reaching a
# runtime image.
benchmark = [
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "xgboost>=2.0",
]
# The prospective recorder's live collection layer. `requests` and
# `prometheus-client` are already core, so the only thing acquisition adds is a
# websocket client. Its own group because the offline core -- the contract, the
# parsers, the append-only sink and the normalizer -- imports none of it: a
# process that only reads recorded days never installs a socket library.
recorder = [
    "websockets>=13",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "httpx>=0.27",
    "black>=24.3",
    "flake8>=7.0",
    "mypy>=1.9",
    "pre-commit>=3.6",
]
all = ["projectchimera[trade,ml,tracking,tune,benchmark,recorder,dev]"]

[tool.setuptools.packages.find]
# Discovered rather than listed. Each container image copies only the packages
# it actually needs before installing, and an explicit `packages = [...]` list
# makes setuptools fail with "package directory 'nn' does not exist" whenever a
# declared package is absent. Globbing tolerates a partial source tree, so the
# same pyproject.toml installs cleanly in the Freqtrade image, the inference
# image and a full checkout.
include = ["chimera*", "nn*", "strategies*", "tools*"]

[tool.setuptools.package-data]
# The committed research contracts. They are data the research entrypoints
# cannot run without — the sealed boundary lives in them — so they ship with
# the package rather than being looked up relative to a checkout.
nn = ["research_contracts/*.json"]
# The committed recorder contracts, for the same reason: the prospective
# boundary and everything the recorder will acquire live in them, and
# `chimera.recorder.contract` has nothing to select from without them.
chimera = ["recorder/contracts/*.json"]

[tool.black]
line-length = 95
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# Freqtrade strategies subclass a dynamically-typed base and receive kwargs
# whose types Freqtrade itself does not annotate.
module = "strategies.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*",
    "ignore:Using `httpx` with `starlette.testclient`:UserWarning",
]
