[flake8]
# Matches black's configured line length in pyproject.toml.
max-line-length = 95
extend-ignore =
    # Whitespace before ':' — black formats slices this way.
    E203,
    # Line break before binary operator — black's preferred style.
    W503
exclude =
    .git,
    __pycache__,
    build,
    dist,
    .venv,
    venv
per-file-ignores =
    # Test files assert on long, readable expressions.
    tests/*:E501
